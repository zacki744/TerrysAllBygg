# Bygger och testar frontend och backend vid varje push och pull request.
# Deploy sker manuellt till Simply.com (se README → Deployment).
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore TABB/API/TerrysAllBygg.sln
      - run: dotnet build TABB/API/TerrysAllBygg.sln --configuration Release --no-restore
      - run: dotnet test TABB/Tests/Tests.csproj --configuration Release --no-build --verbosity normal
